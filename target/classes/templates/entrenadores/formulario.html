<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${entrenador.id != null ? 'Editar Entrenador' : 'Nuevo Entrenador'}">Formulario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="d-flex justify-between align-center">
                <a th:href="@{/}" class="navbar-brand">⚽ Dimayor</a>
                <div class="d-flex gap-2">
                    <a th:href="@{/}" class="nav-link">Inicio</a>
                    <a th:href="@{/clubes}" class="nav-link">Clubes</a>
                    <a th:href="@{/jugadores}" class="nav-link">Jugadores</a>
                    <a th:href="@{/entrenadores}" class="nav-link">Entrenadores</a>
                    <a th:href="@{/asociaciones}" class="nav-link">Asociaciones</a>
                    <a th:href="@{/competiciones}" class="nav-link">Competiciones</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 th:text="${entrenador.id != null ? '✏️ Editar Entrenador' : '➕ Nuevo Entrenador'}">Formulario</h1>
        </div>

        <div class="card fade-in">
            <form th:action="@{/entrenadores/guardar}" th:object="${entrenador}" method="post">
                <input type="hidden" th:field="*{id}">
                
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Nombre *</label>
                        <input type="text" class="form-control" th:field="*{nombre}" 
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Apellido *</label>
                        <input type="text" class="form-control" th:field="*{apellido}" 
                               th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Edad *</label>
                        <input type="number" class="form-control" th:field="*{edad}" min="18" max="80" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Nacionalidad *</label>
                        <input type="text" class="form-control" th:field="*{nacionalidad}" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Especialidad</label>
                        <input type="text" class="form-control" th:field="*{especialidad}" placeholder="Ej: Táctica defensiva">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Años de Experiencia</label>
                        <input type="number" class="form-control" th:field="*{añosExperiencia}" min="0">
                    </div>
                </div>

                <div class="btn-group mt-3">
                    <button type="submit" class="btn btn-success">💾 Guardar</button>
                    <a th:href="@{/entrenadores}" class="btn btn-secondary">❌ Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>© 2025 Dimayor | Desarrollado por Daniel Pérez</p>
    </footer>
</body>
</html>
