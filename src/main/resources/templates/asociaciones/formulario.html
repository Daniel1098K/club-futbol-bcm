<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${asociacion.id != null ? 'Editar Asociación' : 'Nueva Asociación'}">Formulario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="d-flex justify-between align-center">
                <a th:href="@{/}" class="navbar-brand">⚽ Dimayor</a>
                <div class="d-flex gap-2">
                    <a th:href="@{/}" class="nav-link">Inicio</a>
                    <a th:href="@{/clubes}" class="nav-link">Clubes</a>
                    <a th:href="@{/jugadores}" class="nav-link">Jugadores</a>
                    <a th:href="@{/entrenadores}" class="nav-link">Entrenadores</a>
                    <a th:href="@{/asociaciones}" class="nav-link">Asociaciones</a>
                    <a th:href="@{/competiciones}" class="nav-link">Competiciones</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 th:text="${asociacion.id != null ? '✏️ Editar Asociación' : '➕ Nueva Asociación'}">Formulario</h1>
        </div>

        <div class="card fade-in">
            <form th:action="@{/asociaciones/guardar}" th:object="${asociacion}" method="post">
                <input type="hidden" th:field="*{id}">
                
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Nombre *</label>
                        <input type="text" class="form-control" th:field="*{nombre}" 
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''" 
                               placeholder="Ej: Federación Colombiana de Fútbol" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">País *</label>
                        <input type="text" class="form-control" th:field="*{pais}" 
                               th:classappend="${#fields.hasErrors('pais')} ? 'is-invalid' : ''" 
                               placeholder="Ej: Colombia" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('pais')}" th:errors="*{pais}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Presidente *</label>
                        <input type="text" class="form-control" th:field="*{presidente}" 
                               th:classappend="${#fields.hasErrors('presidente')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('presidente')}" th:errors="*{presidente}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Año de Fundación</label>
                        <input type="number" class="form-control" th:field="*{añoFundacion}" min="1850" max="2025">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Sede</label>
                        <input type="text" class="form-control" th:field="*{sede}" placeholder="Ciudad o dirección de la sede">
                    </div>
                </div>

                <div class="btn-group mt-3">
                    <button type="submit" class="btn btn-success">💾 Guardar</button>
                    <a th:href="@{/asociaciones}" class="btn btn-secondary">❌ Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>© 2025 Dimayor | Desarrollado por Daniel Pérez</p>
    </footer>
</body>
</html>
